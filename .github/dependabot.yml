# Automatically updates dependency versions using dependabot.

version: 2
updates:

  # Maintains Python dependencies in `pyproject.toml` and `uv.lock`.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Maintains the versions of the actions used in `.github/workflows`.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
